[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 32
samples = 1000
nsteps = 100

[output]
filename = ${PWD}/Hubble_Tension_Evolution-1/.run-data/flat_wcdm/pantheon_wcdm.txt
format = text

[pipeline]
modules = consistency astropy pantheon_plus
values = ${PWD}/Hubble_Tension_Evolution-1/configs/pantheon_wcdm_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/Hubble_Tension_Evolution-1/.run-data/pantheon_test
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[astropy]
file = background/astropy_background/astropy_background.py
model = flatwcdm
nz = 300
zmax = 3.0

[pantheon_plus]
file = likelihood/pantheon_plus/pantheon_plus_shoes.py
likelihood_only = T
include_shoes = T
