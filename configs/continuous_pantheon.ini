[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 48
samples = 1500
nsteps = 100

[output]
filename = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/pantheonplussh0es.txt
format = text

[pipeline]
modules = consistency curved_astropy_background pantheon_plus
values = ${PWD}/h0-across-cosmological-probes/configs/continuous_pantheon_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/test_pantheon
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[curved_astropy_background]
file = h0-across-cosmological-probes/scripts/curved_astropy_background.py
zmax = 3.0
nz = 500
tcmb = 2.7255
neff = 3.046

[pantheon_plus]
file = likelihood/pantheon_plus/pantheon_plus_shoes.py
likelihood_only = T
include_shoes = T
