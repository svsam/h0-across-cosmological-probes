[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 24
samples = 600
nsteps = 20

[output]
filename = ${PWD}/Hubble_Tension_Evolution-1/.run-data/continuous/desi_dr2_bao.txt
format = text

[pipeline]
modules = consistency camb desi_dr2
values = ${PWD}/Hubble_Tension_Evolution-1/configs/continuous_desi_dr2_bao_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/Hubble_Tension_Evolution-1/.run-data/continuous/test_desi_dr2
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = thermal
feedback = 0
AccuracyBoost = 1.0
do_reionization = F
use_ppf_w = T
zmin_background = 0.0
zmax_background = 3.0
nz_background = 301

[desi_dr2]
file = likelihood/bao/desi-dr2/desi_dr2.py
desi_data_sets = all
