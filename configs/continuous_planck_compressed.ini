[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 24
samples = 600
nsteps = 20

[output]
filename = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/planck_compressed.txt
format = text

[pipeline]
modules = consistency camb planck_compressed
values = ${PWD}/h0-across-cosmological-probes/configs/continuous_planck_compressed_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/test_planck_compressed
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = thermal
feedback = 0
AccuracyBoost = 1.0
do_reionization = F
use_ppf_w = T
zmin_background = 0.0
zmax_background = 3.0
nz_background = 301

[planck_compressed]
file = h0-across-cosmological-probes/scripts/planck_compressed.py
