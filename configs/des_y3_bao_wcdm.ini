[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 32
samples = 1000
nsteps = 100

[output]
filename = ${PWD}/h0-across-cosmological-probes/.run-data/flat_wcdm/des_y3_bao_wcdm.txt
format = text

[pipeline]
modules = consistency camb des_y3_bao
values = ${PWD}/h0-across-cosmological-probes/configs/des_y3_bao_wcdm_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/h0-across-cosmological-probes/.run-data/des_test
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = thermal
feedback = 0
AccuracyBoost = 1.0
do_reionization = F
use_ppf_w = T
zmin_background = 0.0
zmax_background = 2.0
nz_background = 201

[des_y3_bao]
file = h0-across-cosmological-probes/scripts/modules/des_y3_bao_supported.py
chi2_column = 1
strict_support = T
