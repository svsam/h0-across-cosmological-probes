[runtime]
sampler = emcee
root = ${PWD}
resume = T
verbosity = quiet

[emcee]
walkers = 24
samples = 600
nsteps = 20

[output]
filename = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/planck_lite.txt
format = text

[pipeline]
modules = consistency camb planck_lite
values = ${PWD}/h0-across-cosmological-probes/configs/continuous_planck_lite_values.ini
debug = F
timing = F

[test]
save_dir = ${PWD}/h0-across-cosmological-probes/.run-data/continuous/test_planck_lite
fatal_errors = T

[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode = cmb
lmax = 2800
feedback = 0
AccuracyBoost = 1.1
do_lensing = T
use_ppf_w = T

[planck_lite]
file = likelihood/planck_py/planck_py_interface.py
use_low_ell_bins = T
spectra = TTTEEE
year = 2018
likelihood_only = T
